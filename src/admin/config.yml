# Decap CMS configuration — editor lives at /admin
# Login uses Netlify's GitHub OAuth provider (Site settings → Access & security → OAuth).
backend:
  name: github
  repo: aigarsorav/nonsenss-design
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    create: "content: add {{slug}}"
    update: "content: update {{slug}}"
    delete: "content: remove {{slug}}"
    uploadMedia: "media: add {{path}}"
    deleteMedia: "media: remove {{path}}"

# Photos uploaded through the editor are stored here. The build generates
# compressed, resized WebP/JPEG versions automatically — upload the best quality you have.
media_folder: images/uploads
public_folder: /images/uploads

site_url: /
display_url: /
logo_url: /assets/favicon.svg

collections:
  - name: site
    label: Site content
    description: "Every text and image on the page. Click a section to edit it. Changes go live a minute or two after you press Publish."
    files:

      # ------------------------------------------------------------ Settings
      - name: settings
        label: "Site settings (SEO)"
        file: content/settings.json
        fields:
          - { label: "Browser tab / search title", name: siteTitle, widget: string, hint: "Shown in the browser tab and as the headline in Google results." }
          - { label: "Search description", name: siteDescription, widget: text, hint: "One or two sentences shown under the title in Google and when the link is shared." }
          - { label: "Site address", name: siteUrl, widget: string, hint: "The full public address, e.g. https://apexline.ee — no trailing slash." }
          - { label: "Share image", name: shareImage, widget: image, required: false, hint: "Picture shown when the link is shared on social media or in chats. Landscape, about 1200×630." }
          - { label: "Language code", name: language, widget: string, default: en, hint: "Two-letter code of the page language, e.g. en or et." }

      # ------------------------------------------------------------ Header
      - name: header
        label: "Header & menu"
        file: content/header.json
        fields:
          - { label: "Logo text", name: logoText, widget: string, hint: "The big word in the top-left corner." }
          - { label: "Logo small text", name: logoSubtext, widget: string, required: false, hint: "Small word next to the logo (hidden on phones)." }
          - label: "Menu labels"
            name: nav
            widget: object
            hint: "The menu always links to the same four sections — only the words change."
            fields:
              - { label: "Work", name: work, widget: string }
              - { label: "Services", name: services, widget: string }
              - { label: "Process", name: process, widget: string }
              - { label: "Studio", name: studio, widget: string }
          - { label: "Yellow button text", name: buttonText, widget: string, hint: "The button in the menu that jumps to the quote form." }
          - { label: "Open-menu label (screen readers)", name: openMenuLabel, widget: string, default: "Open menu" }
          - { label: "Close-menu label (screen readers)", name: closeMenuLabel, widget: string, default: "Close menu" }

      # ------------------------------------------------------------ Hero
      - name: hero
        label: "Hero (top of page)"
        file: content/hero.json
        fields:
          - { label: "Small line above the headline", name: eyebrow, widget: string, hint: "e.g. Tallinn, Estonia · wrap & graphics studio" }
          - { label: "Headline (white part)", name: headline, widget: text, hint: "Press Enter to force a line break. The yellow part is added after this." }
          - { label: "Headline (yellow part)", name: headlineHighlight, widget: string, hint: "Shown in lime yellow right after the white part." }
          - { label: "Intro paragraph", name: intro, widget: text }
          - { label: "Yellow button text", name: primaryButton, widget: string, hint: "Jumps to the quote form." }
          - { label: "Outlined button text", name: secondaryButton, widget: string, hint: "Jumps to the work section." }
          - { label: "Background photo", name: backgroundImage, widget: image, hint: "Wide landscape photo, at least 2000 px wide. It is darkened automatically so text stays readable." }
          - { label: "Background photo description", name: backgroundAlt, widget: string, hint: "Describe the photo in a few words for screen readers and search engines." }

      # ------------------------------------------------------------ Specs
      - name: specs
        label: "Spec strip (under the hero)"
        file: content/specs.json
        fields:
          - label: "Items"
            name: items
            widget: list
            hint: "Four items fit best on desktop. Drag the handle to reorder."
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { label: "Small label", name: label, widget: string, hint: "e.g. Material" }
              - { label: "Value", name: value, widget: string, hint: "e.g. Cast PVC 140g" }

      # ------------------------------------------------------------ Marquee
      - name: marquee
        label: "Scrolling keyword strip"
        file: content/marquee.json
        fields:
          - label: "Keywords"
            name: keywords
            widget: list
            field: { label: "Keyword", name: keyword, widget: string }
            hint: "Short phrases that scroll continuously across the strip. Add, remove or drag to reorder."

      # ------------------------------------------------------------ Work
      - name: work
        label: "Work (projects)"
        file: content/work.json
        fields:
          - { label: "Small label", name: label, widget: string, hint: "e.g. Selected work" }
          - { label: "Headline", name: headline, widget: text, hint: "Press Enter to force a line break." }
          - { label: "'Show everything' filter text", name: allLabel, widget: string, default: "All work", hint: "This filter is always first and shows every project." }
          - label: "Filter categories"
            name: categories
            widget: list
            hint: "The filter buttons above the project grid. Add, rename, remove or reorder. Every project below must be assigned one of these — if you rename a category, re-select it on its projects."
            summary: "{{fields.name}}"
            fields:
              - { label: "Category name", name: name, widget: string }
          - label: "Projects"
            name: projects
            widget: list
            hint: "Drag the handle to change the order on the page. The first gallery photo is the card cover."
            summary: "{{fields.title}} — {{fields.subtitle}} ({{fields.year}})"
            fields:
              - { label: "Title", name: title, widget: string, hint: "e.g. Gate Drop" }
              - { label: "Subtitle", name: subtitle, widget: string, required: false, hint: "Bike, vehicle or client, e.g. KTM 250 SX-F" }
              - { label: "Year", name: year, widget: string, required: false, hint: "Shown as a small tag on the photo." }
              - label: "Category"
                name: category
                widget: relation
                collection: site
                file: work
                search_fields: ["categories.*.name"]
                value_field: "categories.*.name"
                display_fields: ["categories.*.name"]
                hint: "Pick one of the filter categories from the list above."
              - { label: "Details line", name: details, widget: string, required: false, hint: "Short spec line revealed on hover, e.g. Full plastics wrap · matte laminate" }
              - label: "Gallery"
                name: gallery
                widget: list
                min: 1
                hint: "One or more photos. The first one is the card cover; visitors can click through the rest in a fullscreen viewer. Drag to reorder."
                summary: "{{fields.alt}}"
                fields:
                  - { label: "Photo", name: image, widget: image, hint: "Landscape 4:3 works best for the cover. Any size — it is compressed at build time." }
                  - { label: "Photo description", name: alt, widget: string, required: false, hint: "A few words describing the photo, for screen readers and search engines." }
          - { label: "Gallery viewer name (screen readers)", name: galleryLabel, widget: string, default: "Project gallery" }
          - { label: "'Open gallery' label (screen readers)", name: openGalleryLabel, widget: string, default: "Open gallery" }
          - { label: "'Previous image' label (screen readers)", name: previousLabel, widget: string, default: "Previous image" }
          - { label: "'Next image' label (screen readers)", name: nextLabel, widget: string, default: "Next image" }
          - { label: "'Close gallery' label (screen readers)", name: closeLabel, widget: string, default: "Close gallery" }

      # ------------------------------------------------------------ Services
      - name: services
        label: "Services"
        file: content/services.json
        fields:
          - { label: "Small label", name: label, widget: string, hint: "e.g. What we do" }
          - { label: "Headline", name: headline, widget: text, hint: "Press Enter to force a line break." }
          - { label: "Text", name: text, widget: text }
          - label: "Services"
            name: services
            widget: list
            hint: "Numbering (01, 02, …) is added automatically. Drag to reorder."
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - label: "Tags"
                name: tags
                widget: list
                required: false
                field: { label: "Tag", name: tag, widget: string }
                hint: "Small outlined keywords under the description."

      # ------------------------------------------------------------ Process
      - name: process
        label: "Process"
        file: content/process.json
        fields:
          - { label: "Small label", name: label, widget: string, hint: "e.g. How it runs" }
          - { label: "Headline", name: headline, widget: text, hint: "Press Enter to force a line break." }
          - { label: "Intro", name: intro, widget: text }
          - label: "Steps"
            name: steps
            widget: list
            hint: "Numbered automatically. Four steps fit in one row on desktop."
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }

      # ------------------------------------------------------------ Studio
      - name: studio
        label: "Studio / about"
        file: content/studio.json
        fields:
          - { label: "Photo", name: image, widget: image, hint: "Landscape 4:3 works best." }
          - { label: "Photo description", name: imageAlt, widget: string, hint: "A few words describing the photo, for screen readers." }
          - { label: "Caption on the photo", name: imageCaption, widget: string, required: false, hint: "Small text in the bottom-left corner of the photo." }
          - { label: "Small label", name: label, widget: string, hint: "e.g. The workshop" }
          - { label: "Headline", name: headline, widget: text, hint: "Press Enter to force a line break." }
          - { label: "Text", name: text, widget: text }
          - { label: "Second paragraph", name: textSecondary, widget: text, required: false, hint: "Shown in grey under the main text. Leave empty to hide." }
          - label: "Numbers"
            name: stats
            widget: list
            required: false
            hint: "Big number + small caption. Four fit best."
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - { label: "Value", name: value, widget: string, hint: "e.g. 400+" }
              - { label: "Caption", name: label, widget: string, hint: "e.g. Bikes kitted" }

      # ------------------------------------------------------------ Quote
      - name: quote
        label: "Quote section & form"
        file: content/quote.json
        fields:
          - { label: "Small label", name: label, widget: string, hint: "e.g. Request a quote" }
          - { label: "Headline", name: headline, widget: text, hint: "Press Enter to force a line break." }
          - { label: "Text", name: text, widget: text }
          - label: "Steps"
            name: steps
            widget: list
            hint: "Numbered automatically."
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }
          - { label: "'Or write directly' text", name: directText, widget: string, hint: "Shown before the email address." }
          - { label: "Direct email address", name: directEmail, widget: string, hint: "Clicking it opens the visitor's email app." }
          - label: "Form"
            name: form
            widget: object
            hint: "Labels, placeholder texts and options of the quote form. Submissions arrive in Netlify → Forms (and by email if notifications are set up)."
            fields:
              - { label: "Name — label", name: nameLabel, widget: string }
              - { label: "Name — placeholder", name: namePlaceholder, widget: string }
              - { label: "Email — label", name: emailLabel, widget: string }
              - { label: "Email — placeholder", name: emailPlaceholder, widget: string }
              - { label: "Phone — label", name: phoneLabel, widget: string }
              - { label: "Phone — placeholder", name: phonePlaceholder, widget: string }
              - { label: "Bike or vehicle — label", name: vehicleLabel, widget: string }
              - { label: "Bike or vehicle — placeholder", name: vehiclePlaceholder, widget: string }
              - { label: "'What do you need' — label", name: needLabel, widget: string }
              - label: "'What do you need' — options"
                name: needOptions
                widget: list
                hint: "Buttons the visitor picks from. Tick 'Pre-selected' on exactly one."
                summary: "{{fields.label}}"
                fields:
                  - { label: "Option text", name: label, widget: string }
                  - { label: "Pre-selected", name: selected, widget: boolean, default: false, required: false }
              - { label: "Due date — label", name: dateLabel, widget: string }
              - { label: "Finish — label", name: finishLabel, widget: string }
              - label: "Finish — options"
                name: finishOptions
                widget: list
                hint: "Tick 'Pre-selected' on exactly one."
                summary: "{{fields.label}}"
                fields:
                  - { label: "Option text", name: label, widget: string }
                  - { label: "Pre-selected", name: selected, widget: boolean, default: false, required: false }
              - { label: "Brief — label", name: briefLabel, widget: string }
              - { label: "Brief — placeholder", name: briefPlaceholder, widget: text }
              - { label: "Photos — label", name: photosLabel, widget: string }
              - { label: "Photos — button text", name: photosButton, widget: string }
              - { label: "Photos — one attached", name: photosAttachedOne, widget: string, hint: "Shown after the visitor picks a single photo." }
              - { label: "Photos — several attached", name: photosAttachedMany, widget: string, hint: "Use {count} where the number should go." }
              - { label: "Photos — too large message", name: photosTooLarge, widget: string, hint: "Shown if the photos add up to more than 8 MB." }
              - { label: "Send button text", name: buttonText, widget: string }
              - { label: "Send button text while sending", name: sendingText, widget: string }
              - { label: "Note under the button", name: note, widget: string }
              - { label: "Error message", name: errorMessage, widget: string, hint: "Shown if sending fails." }
          - label: "Success message"
            name: success
            widget: object
            hint: "Replaces the form after a successful submission."
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Message", name: message, widget: text, hint: "Use {name} where the visitor's first name should go." }
              - { label: "'Send another' link text", name: againButton, widget: string }

      # ------------------------------------------------------------ Footer
      - name: footer
        label: "Footer"
        file: content/footer.json
        fields:
          - { label: "Brand name", name: brand, widget: string }
          - { label: "Description", name: description, widget: text }
          - { label: "Contact column — heading", name: contactLabel, widget: string }
          - { label: "Email", name: email, widget: string }
          - { label: "Phone", name: phone, widget: string, hint: "Written as it should be displayed, e.g. +372 5555 5555" }
          - { label: "Opening hours", name: hours, widget: string }
          - { label: "Links column — heading", name: elsewhereLabel, widget: string }
          - { label: "Instagram — link text", name: instagramLabel, widget: string }
          - { label: "Instagram — address", name: instagramUrl, widget: string, required: false, hint: "Full address, e.g. https://instagram.com/apexline. Leave empty to hide." }
          - label: "Other links"
            name: links
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Link text", name: label, widget: string }
              - { label: "Address", name: url, widget: string, hint: "A page section like #quote, or a full address." }
              - { label: "Show in grey", name: muted, widget: boolean, default: false, required: false }
          - { label: "Copyright line", name: copyright, widget: string }
          - { label: "Tagline (bottom right)", name: tagline, widget: string }
